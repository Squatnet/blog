name: Build

# Forgejo-only workflow. GitHub ignores .forgejo/, and Forgejo reads this
# directory in preference to .github/workflows, so the GitHub Pages deploy
# in .github/workflows/pages.yml never runs here (it uses actions that only
# exist on GitHub). This job only proves the site builds.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build site
        run: |
          set -euo pipefail
          HUGO_VERSION=0.168.0
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          /tmp/hugo version
          /tmp/hugo --minify --gc
